name: Bootstrap verified LönKoll static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-static-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Import verified build
        env:
          SOURCE_ZIP: https://sdmntprnortheu.oaiusercontent.com/files/00000000-1f94-81f4-bcc9-74638cdffe20/raw?se=2026-10-14T20%3A29%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=a1bd3d50-ed5f-5243-9859-df07f2f9e199&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-14T05%3A20%3A38Z&ske=2026-10-15T05%3A20%3A38Z&sks=b&skv=2026-02-06&sig=1N373YrFDuTcsYjwgOYWt5EiRmh4SRXuX9cO9zoHEBI%3D
          EXPECTED_SHA256: f51be9a9526e32f1505f936eae81dd5cbc2abcfdb045f22eb962b5160833efed
        run: |
          set -euo pipefail
          if test -f index.html; then echo 'Compiled site already present; nothing to bootstrap'; exit 0; fi
          curl --fail --location --retry 3 --connect-timeout 10 --max-time 90 --silent --show-error "$SOURCE_ZIP" -o /tmp/lonkoll-static.zip
          printf "%s  %s\n" "$EXPECTED_SHA256" /tmp/lonkoll-static.zip | sha256sum --check --status
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path('/tmp/lonkoll-static.zip')
          with zipfile.ZipFile(p) as f:
              names=f.namelist()
              assert 'index.html' in names and 'build-meta.json' in names and 'sw.js' in names
              assert len(names) >= 40
              assert all(not name.startswith('/') and '..' not in pathlib.PurePosixPath(name).parts for name in names)
              assert all((info.external_attr >> 16) & 0o170000 != 0o120000 for info in f.infolist())
              f.extractall('.')
          PY
          printf '\n' > .nojekyll
          echo 'Static website build only. Source repository stays private. Calculations are estimates, not verified collective-agreement payroll.' > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets icons sw.js offline.html offline.css manifest.webmanifest build-meta.json README.md .nojekyll
          git diff --cached --quiet || (git commit -m 'deploy: import verified LönKoll production build' && git push origin HEAD:main)
