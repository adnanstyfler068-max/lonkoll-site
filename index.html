<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Planera arbetspass och beräkna löneestimat lokalt på din enhet.">
    <meta name="theme-color" content="#0b5c4b">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; manifest-src 'self'; worker-src 'self'; media-src 'none'"
    >

    <meta name="application-name" content="LönKoll Sverige">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LönKoll">
    <meta name="format-detection" content="telephone=no">

    <title>LönKoll Sverige</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Hoppa till innehållet</a>
    <div id="application-shell">
      <div id="app" data-testid="app-root" aria-busy="true">
        <p role="status">Laddar LönKoll…</p>
      </div>
    </div>
    <div id="app-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <noscript>
      <p>LönKoll behöver JavaScript för att lagra och beräkna dina uppgifter lokalt på enheten.</p>
    </noscript>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
